[project]
name = "integration-kit"
version = "1.0.0"
description = "Reference API, Python and JavaScript SDKs, and playbooks for customer API integrations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = [".", "sdk/python"]
testpaths = ["tests"]

[tool.uv]
package = false
